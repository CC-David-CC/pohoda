<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pohoda · WebOS mount demo</title>
<style>
  body { margin:0; padding:20px; background:#111827; color:#e5e7eb; font:14px/1.5 system-ui,sans-serif }
  header { max-width:1100px; margin:0 auto 16px }
  h1 { font-size:22px; margin:0 0 6px }
  p { margin:4px 0 12px; color:#cbd5e1 }
  form { display:flex; flex-wrap:wrap; align-items:center; gap:8px }
  input { flex:1; min-width:180px; padding:9px; border:1px solid #475569; border-radius:6px; background:#1e293b; color:white }
  button { padding:9px 14px; border:0; border-radius:6px; background:#dbeafe; color:#1e3a8a; cursor:pointer }
  #window { width:min(1100px,100%); height:740px; min-width:300px; min-height:360px; max-width:100%; resize:both; overflow:hidden; margin:auto; border:1px solid #475569; border-radius:12px }
  #status { min-height:21px; color:#94a3b8; margin-top:7px }
</style>
<header>
  <h1>Pohoda in a desktop window</h1>
  <p>The app uses the real <code>mount(host)</code> entry. Drag the window's lower corner to resize it.
     Supply the compatible weather API; this static page does not contain a weather server.</p>
  <form id="config">
    <label for="api">Weather API</label><input id="api" value="/api" aria-label="Weather API base URL">
    <button>Open / reopen</button><button id="close" type="button">Close</button>
  </form>
  <div id="status" role="status"></div>
</header>
<main id="window"></main>
<script type="module">
  import { createApp } from './app.mjs';
  const host = document.getElementById('window');
  const status = document.getElementById('status');
  let app;
  function open() {
    app?.dispose();
    app = createApp({
      apiBase: document.getElementById('api').value.trim() || '/api',
      onTitle: title => { status.textContent = title; },
      onError: error => { status.textContent = String(error); },
    })(host);
    status.textContent = 'Mounted synchronously. Waiting for the weather service.';
  }
  document.getElementById('config').addEventListener('submit', event => { event.preventDefault(); open(); });
  document.getElementById('close').addEventListener('click', () => { app?.dispose(); app = null; status.textContent = 'Disposed. The host window is still present.'; });
  window.addEventListener('pagehide', () => app?.dispose());
  open();
</script>
</html>
